name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v2
    - name: 安装 XeLaTeX 与中文字体
      run: sudo apt-get install texlive-xetex texlive-latex-extra texlive-lang-chinese fonts-noto-cjk
    - name: 构建 PDF
      run: make kactl
    - name: 验证所有头文件可编译
      run: make test-compiles
    - name: 运行对拍测试
      run: make test
